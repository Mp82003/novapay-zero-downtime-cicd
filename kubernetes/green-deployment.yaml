
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novapay-green
  labels:
    app: novapay-green
    version: green

spec:
  replicas: 2

  selector:
    matchLabels:
      app: novapay-green

  template:
    metadata:
      labels:
        app: novapay-green
        version: green

    spec:
      containers:
        - name: novapay-api
          image: novapay-api:green-v2
          imagePullPolicy: Never

          command: ["node"]
          args: ["src/server-green.js"]

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: novapay-config
            - secretRef:
                name: novapay-secret

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"


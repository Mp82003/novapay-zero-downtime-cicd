
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: novapay-progressive

spec:
  replicas: 2

  selector:
    matchLabels:
      app: novapay-rollout

  template:
    metadata:
      labels:
        app: novapay-rollout

    spec:
      containers:
        - name: novapay-api
          image: novapay-api:green-v3-db
          imagePullPolicy: Never

          command: ["node"]
          args: ["src/server-green.js"]

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: novapay-config
            - secretRef:
                name: novapay-secret

          # PostgreSQL connection configuration
          env:
            - name: DB_HOST
              value: "novapay-postgres"

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: novapay-postgres-secret
                  key: POSTGRES_DB

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: novapay-postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novapay-postgres-secret
                  key: POSTGRES_PASSWORD

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

  strategy:
    canary:
      stableService: novapay-rollout-stable
      canaryService: novapay-rollout-canary

      trafficRouting:
        nginx:
          stableIngress: novapay-rollout-ingress

      maxSurge: 1
      maxUnavailable: 0
      abortScaleDownDelaySeconds: 30

      steps:
        - setWeight: 10
        - pause:
            duration: 60s

        - setWeight: 30
        - pause:
            duration: 60s

        - setWeight: 50
        - pause:
            duration: 60s

        - setWeight: 100

---
apiVersion: v1
kind: Service
metadata:
  name: novapay-rollout-stable
spec:
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: novapay-rollout

---
apiVersion: v1
kind: Service
metadata:
  name: novapay-rollout-canary
spec:
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: novapay-rollout

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novapay-rollout-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: novapay.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: novapay-rollout-stable
                port:
                  number: 80

